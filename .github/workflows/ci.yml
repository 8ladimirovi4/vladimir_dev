name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ${{ vars.CI_RUNNER_IMAGE || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

  build:
    name: Build
    runs-on: ${{ vars.CI_RUNNER_IMAGE || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ${{ vars.CI_RUNNER_IMAGE || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_SITE_URL=http://127.0.0.1
          cache-from: type=gha
          cache-to: type=gha,mode=max
