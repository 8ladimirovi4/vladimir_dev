name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Image names follow the current GitHub repo (owner/name).
# Optional overrides: repository Variables DOCKERHUB_REPO, GHCR_REPO.
env:
  DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO || github.repository }}
  GHCR_REPO: ${{ vars.GHCR_REPO || format('ghcr.io/{0}', github.repository) }}

jobs:
  guard:
    name: Guard tag on main
    runs-on: ${{ vars.CI_RUNNER_IMAGE || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on main
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on main — aborting."
            exit 1
          fi

  image:
    name: Build and push image
    needs: guard
    runs-on: ${{ vars.CI_RUNNER_IMAGE || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.PROD_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: image
    runs-on: ${{ vars.CI_RUNNER_IMAGE || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync compose stack to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,deploy/"
          target: /opt/vladimir_dev
          overwrite: true

      - name: Pull and restart stack
        uses: appleboy/ssh-action@v1.2.0
        env:
          WEB_IMAGE: ${{ env.DOCKERHUB_REPO }}:${{ github.ref_name }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.PROD_SITE_URL }}
          SERVER_IP: ${{ secrets.VPS_HOST }}
          NGINX_HTTPS_PORT: ${{ vars.NGINX_HTTPS_PORT || '8443' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: WEB_IMAGE,NEXT_PUBLIC_SITE_URL,SERVER_IP,NGINX_HTTPS_PORT
          script: |
            set -eu
            cd /opt/vladimir_dev

            umask 077
            cat > .env <<EOF
            WEB_IMAGE=${WEB_IMAGE}
            NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
            SERVER_IP=${SERVER_IP}
            NGINX_HTTPS_PORT=${NGINX_HTTPS_PORT}
            EOF

            if [ ! -f deploy/nginx/certs/fullchain.pem ] || [ ! -f deploy/nginx/certs/privkey.pem ]; then
              chmod +x deploy/nginx/gen-selfsigned.sh
              SERVER_IP="${SERVER_IP}" ./deploy/nginx/gen-selfsigned.sh
            fi

            docker compose pull
            docker compose up -d
            docker image prune -f

            curl -fkfsS "https://127.0.0.1:${NGINX_HTTPS_PORT}/" >/dev/null
            echo "Deploy health-check OK"
