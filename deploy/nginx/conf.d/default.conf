# v1.1.0: Let's Encrypt (certbot webroot). Certificate: /etc/letsencrypt/live/vlleo.com
# (volume certbot-certs, shared read-only with this container).
# Port 80 keeps the ACME location for renew and redirects everything else to HTTPS.
server {
  listen 80;
  server_name vlleo.com www.vlleo.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location / {
    return 301 https://vlleo.com$request_uri;
  }
}

# www → apex (same certificate covers both names)
server {
  listen 443 ssl;
  server_name www.vlleo.com;

  ssl_certificate     /etc/letsencrypt/live/vlleo.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vlleo.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  return 301 https://vlleo.com$request_uri;
}

server {
  listen 443 ssl;
  server_name vlleo.com;

  ssl_certificate     /etc/letsencrypt/live/vlleo.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vlleo.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  limit_req zone=req burst=20 nodelay;
  limit_conn conn 20;

  # Security headers (HSTS is added later, after HTTPS has been stable for 1-2 days)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
